<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moods of the Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#232a3d;
    --bg-panel:#2e3650;
    --wood:#8c5b33;
    --wood-light:#a9713f;
    --amber:#e8a33d;
    --text-light:#f1ead9;
    --text-muted:#b9b2a0;
    --line:rgba(241,234,217,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #3a4566 0%, var(--bg-deep) 55%);
    color:var(--text-light);
    font-family:'Work Sans', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    padding-bottom:96px;
  }
  .stage{
    width:100%;
    max-width:620px;
  }
  .rope-bar{
    height:6px;
    border-radius:3px;
    background:linear-gradient(90deg, var(--wood) 0%, var(--wood) 100%);
    position:relative;
    margin-bottom:10px;
    overflow:hidden;
  }
  .rope-bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--amber), #ffd27a);
    transition:width 0.6s ease;
  }
  .load-label{
    font-size:13px;
    color:var(--text-muted);
    letter-spacing:0.02em;
    margin-bottom:28px;
    display:flex;
    justify-content:space-between;
  }
  .marker{
    font-family:'Bitter', serif;
    font-size:14px;
    color:var(--amber);
    margin-bottom:10px;
  }
  .panel{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:40px 36px;
    position:relative;
  }
  .icon{
    width:64px;
    height:64px;
    margin-bottom:20px;
    color:var(--wood-light);
  }
  h1{
    font-family:'Bitter', serif;
    font-weight:700;
    font-size:28px;
    line-height:1.25;
    margin:0 0 6px 0;
    color:var(--text-light);
  }
  .kicker{
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    color:var(--text-muted);
    margin-bottom:18px;
  }
  p.narration{
    font-family:'Bitter', serif;
    font-size:19px;
    line-height:1.6;
    color:var(--text-light);
    max-width:44ch;
    margin:0 0 30px 0;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  button.choice{
    text-align:left;
    background:transparent;
    border:1px solid var(--line);
    border-left:3px solid var(--wood-light);
    color:var(--text-light);
    font-family:'Work Sans', sans-serif;
    font-size:16px;
    font-weight:500;
    padding:16px 18px;
    border-radius:2px;
    cursor:pointer;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  button.choice:hover, button.choice:focus-visible{
    background:rgba(232,163,61,0.08);
    border-left-color:var(--amber);
    outline:none;
  }
  button.choice:focus-visible{
    box-shadow:0 0 0 2px var(--amber);
  }
  .ending-desc{
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    color:var(--text-muted);
    line-height:1.6;
    border-top:1px solid var(--line);
    padding-top:20px;
    margin-top:24px;
  }
  .ending-desc a{
    color:var(--amber);
  }
  .next-link{
    display:inline-block;
    margin-top:24px;
    background:var(--amber);
    color:var(--bg-deep);
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    font-weight:600;
    padding:12px 20px;
    border-radius:2px;
    text-decoration:none;
  }
  .next-link:hover, .next-link:focus-visible{
    background:#ffd27a;
  }
  .restart{
    margin-top:16px;
    display:block;
    background:none;
    border:none;
    color:var(--amber);
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    cursor:pointer;
    padding:0;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  @media (prefers-reduced-motion: reduce){
    .rope-bar-fill{transition:none;}
  }
  @media (max-width:480px){
    .panel{padding:28px 22px;}
    h1{font-size:24px;}
    p.narration{font-size:17px;}
  }
  .page-badge{
    position:fixed;
    top:18px;
    left:22px;
    font-family:'Work Sans', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:transparent;
    -webkit-text-stroke:1px var(--text-light);
    text-stroke:1px var(--text-light);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.4s ease;
    z-index:20;
  }
  .page-badge.visible{
    opacity:1;
  }
  @media (max-width:480px){
    .page-badge{font-size:12px; top:12px; left:16px;}
  }

  .sound-control{
    position:fixed;
    top:16px;
    right:22px;
    display:flex;
    align-items:center;
    gap:8px;
    z-index:20;
    background:rgba(46,54,80,0.65);
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:20px;
  }
  .sound-icon{
    background:none;
    border:none;
    cursor:pointer;
    font-size:15px;
    line-height:1;
    padding:2px;
    color:var(--text-light);
    opacity:0.85;
  }
  .sound-icon:hover{
    opacity:1;
  }
  .sound-control input[type="range"]{
    width:64px;
    accent-color: var(--amber);
    cursor:pointer;
  }
  @media (max-width:480px){
    .sound-control{top:10px; right:14px; padding:5px 10px; gap:6px;}
    .sound-control input[type="range"]{width:48px;}
  }

  /* Splash screen */
  .splash{
    position:fixed;
    inset:0;
    background:#f2ece0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:opacity 0.8s ease;
  }
  .splash.fade-out{
    opacity:0;
    pointer-events:none;
  }
  .splash img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .splash-hint{
    position:absolute;
    bottom:28px;
    left:0;
    right:0;
    text-align:center;
    font-family:'Work Sans', sans-serif;
    font-size:13px;
    letter-spacing:0.05em;
    color:#1c2236;
    opacity:0.6;
  }

  /* Program intermission (fade image between question flow and reveal) */
  .intermission{
    position:fixed;
    inset:0;
    background:#12172a;
    z-index:90;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.7s ease;
    cursor:pointer;
  }
  .intermission.visible{
    opacity:1;
    pointer-events:auto;
  }
  .intermission img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  .intermission-hint{
    position:absolute;
    bottom:24px;
    left:0;
    right:0;
    text-align:center;
    font-family:'Work Sans', sans-serif;
    font-size:13px;
    letter-spacing:0.05em;
    color:var(--text-muted);
    opacity:0.7;
  }

  /* Mood / energy check-in */
  .mood-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:24px;
  }
  .mood-chip{
    background:transparent;
    border:1px solid var(--line);
    border-left:3px solid var(--wood-light);
    color:var(--text-light);
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    font-weight:500;
    padding:12px 18px;
    border-radius:2px;
    cursor:pointer;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .mood-chip:hover, .mood-chip.selected{
    background:rgba(232,163,61,0.1);
    border-left-color:var(--amber);
  }
  .mood-chip.selected{
    color:var(--amber);
  }
  .mood-custom{
    display:flex;
    gap:10px;
    margin-bottom:8px;
  }
  .mood-custom input{
    flex:1;
    background:rgba(241,234,217,0.05);
    border:1px solid var(--line);
    border-radius:2px;
    color:var(--text-light);
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    padding:12px 14px;
  }
  .mood-custom input::placeholder{
    color:var(--text-muted);
  }
  .play-count{
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:18px;
    min-height:18px;
  }

  .footer-logo{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    width:100%;
    background:#ffffff;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:12px 28px;
    z-index:10;
  }
  .footer-logo img{
    max-width:200px;
    width:100%;
    height:auto;
    display:block;
    transition:opacity 0.2s ease;
  }
  .footer-logo a{
    display:block;
    line-height:0;
  }
  .footer-logo a:hover img{
    opacity:0.75;
  }
  @media (max-width:480px){
    .footer-logo{padding:10px 18px;}
    .footer-logo img{max-width:150px;}
  }

  /* ---- Persona mini-game widgets ---- */
  .persona-progress{
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:16px;
  }
  .persona-prompt{
    font-family:'Bitter', serif;
    font-size:19px;
    line-height:1.5;
    margin:0 0 30px 0;
  }

  /* Slider widget */
  .slider-wrap{margin-bottom:8px;}
  .slider-poles{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    color:var(--text-light);
    margin-bottom:14px;
    gap:16px;
  }
  .slider-poles span{max-width:46%;}
  .slider-track{
    position:relative;
    height:6px;
    background:var(--line);
    border-radius:3px;
    margin:20px 4px;
    touch-action:none;
  }
  .slider-fill{
    position:absolute;
    left:0; top:0; height:100%;
    background:var(--wood-light);
    border-radius:3px;
  }
  .slider-handle{
    position:absolute;
    top:50%;
    width:22px; height:22px;
    background:var(--amber);
    border-radius:50%;
    transform:translate(-50%,-50%);
    cursor:grab;
    box-shadow:0 0 0 4px rgba(232,163,61,0.2);
  }
  .slider-handle:active{cursor:grabbing;}

  /* Selection widget (two clickable statement cards) */
  .rank-stack{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .rank-card{
    display:block;
    width:100%;
    text-align:left;
    background:rgba(241,234,217,0.05);
    border:1px solid var(--line);
    border-left:3px solid var(--wood-light);
    color:var(--text-light);
    font-family:'Work Sans', sans-serif;
    padding:16px 18px;
    font-size:15px;
    border-radius:2px;
    cursor:pointer;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .rank-card:hover, .rank-card:focus-visible{
    background:rgba(232,163,61,0.08);
    border-left-color:var(--amber);
    outline:none;
  }

  /* Bucket widget */
  .bucket-row{
    display:flex;
    gap:12px;
    margin-top:8px;
  }
  .bucket-zone{
    flex:1;
    min-height:110px;
    background:rgba(241,234,217,0.05);
    border:1px dashed var(--line);
    border-radius:4px;
    padding:12px;
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    line-height:1.4;
    color:var(--text-light);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    text-align:center;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .bucket-zone:hover, .bucket-zone:focus-visible{
    background:rgba(232,163,61,0.08);
    border-color:var(--amber);
    outline:none;
  }

  /* Persona result card */
  .persona-title{
    font-family:'Bitter', serif;
    font-weight:700;
    font-size:24px;
    color:var(--amber);
    margin:0 0 8px 0;
  }
  .persona-icon{
    width:72px;
    height:72px;
    color:var(--amber);
    margin-bottom:16px;
  }
  .persona-traits{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:20px;
  }
  .trait-pill{
    border:1px solid var(--line);
    border-radius:20px;
    padding:5px 12px;
    font-size:13px;
    color:var(--text-light);
  }
  .other-personas{
    border-top:1px solid var(--line);
    padding-top:18px;
    margin-bottom:22px;
  }
  .other-personas-label{
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:10px;
  }
  .countdown{
    font-size:12px;
    color:var(--text-muted);
    margin-bottom:16px;
  }
  .countdown.urgent{
    color:var(--amber);
  }
  .message-box{
    width:100%;
    min-height:110px;
    background:rgba(241,234,217,0.05);
    border:1px solid var(--line);
    border-radius:4px;
    color:var(--text-light);
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    line-height:1.6;
    padding:14px;
    resize:vertical;
    margin-bottom:16px;
  }
  .connect-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:20px;
  }
  .copy-btn{
    background:transparent;
    border:1px solid var(--wood-light);
    color:var(--text-light);
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    font-weight:500;
    padding:12px 18px;
    border-radius:2px;
    cursor:pointer;
  }
  .copy-btn:hover{
    border-color:var(--amber);
  }
  .copy-btn.copied{
    border-color:var(--amber);
    color:var(--amber);
  }
</style>
</head>

// Score each dimension independently from only the questions tagged to it,
// then return the archetype/program whose dimension scored highest.
function computeTopArchetype(archetypeList, questions, answers){
  const dimTotals = {}; // dim -> {sum, count}
  questions.forEach((q, i)=>{
    if(!dimTotals[q.dim]) dimTotals[q.dim] = { sum:0, count:0 };
    dimTotals[q.dim].sum += answers[i];
    dimTotals[q.dim].count += 1;
  });
  let best = null;
  archetypeList.forEach(arch=>{
    const d = dimTotals[arch.dim];
    const avg = d ? d.sum / d.count : 0;
    if(!best || avg > best.avg){
      best = { arch, avg };
    }
  });
  return best.arch;
}

function buildWidgetSequence(){
  // 10 questions, mix of the three mechanics, order randomized
  const base = ["slider","slider","slider","slider","rank","rank","rank","bucket","bucket","bucket"];
  for(let i = base.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [base[i], base[j]] = [base[j], base[i]];
  }
  return base;
}

// ---- Countdown (auto-select after 20s of no answer) ----
const CHOICE_SECONDS = 20;
let countdownInterval = null;

function clearCountdown(){
  if(countdownInterval){
    clearInterval(countdownInterval);
    countdownInterval = null;
  }
}

function startCountdown(onTimeout){
  clearCountdown();
  let remaining = CHOICE_SECONDS;
  paintCountdown(remaining);
  countdownInterval = setInterval(()=>{
    remaining--;
    paintCountdown(remaining);
    if(remaining <= 0){
      clearCountdown();
      onTimeout();
    }
  }, 1000);
}

function paintCountdown(remaining){
  const el = document.getElementById('countdownDisplay');
  if(!el) return;
  el.textContent = remaining > 0 ? `Auto-selecting in ${remaining}s` : "Selecting\u2026";
  el.classList.toggle('urgent', remaining <= 5);
}

function renderScene(id){
  const s = scenes[id];

  panel.innerHTML = `

  panel.querySelectorAll('.choice').forEach(btn=>{

  if(s.choices.length > 1){

}

function shuffleArray(arr){
  const copy = arr.slice();
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function startPersonaGame(branch, endingId){
  game = {
    branch,
    endingId,
    phase: "persona",
    progressLabel: "Persona check",
    archetypes: ARCHETYPES[branch],
    questions: shuffleArray(QUESTION_BANKS[branch]),
    widgetTypes: buildWidgetSequence(),
    index: 0,
    answers: []
  };
  renderPersonaQuestion();
}

function startProblemGame(){
  const isOrg = originType === "organization";
  game = {
    branch: game.branch,
    endingId: game.endingId,
    phase: "problem",
    progressLabel: isOrg ? "Organization check" : "Team check",
    archetypes: PROBLEM_PROGRAMS,
    questions: shuffleArray(isOrg ? PROBLEM_QUESTIONS_ORG : PROBLEM_QUESTIONS_INDIVIDUAL),
    widgetTypes: buildWidgetSequence(),
    index: 0,
    answers: []
  };
  renderPersonaQuestion();
}

function renderPersonaQuestion(){
  const q = game.questions[game.index];
  const type = game.widgetTypes[game.index];
  const prompt = game.phase === "problem"
    ? (originType === "organization" ? "Which feels closer to how your organization actually runs?" : "Which feels closer to what you see around you?")
    : "Which feels closer to you?";
  updateBar(game.index / game.questions.length);
  panel.innerHTML = `
    <div class="persona-progress">${game.progressLabel} \u2014 ${game.index + 1} of ${game.questions.length}</div>
    <p class="persona-prompt">${prompt}</p>
    <div class="countdown" id="countdownDisplay"></div>
    <div id="widgetHost"></div>
  `;
  const host = document.getElementById('widgetHost');
  const autoSubmit = { trigger: null };
  if(type === "slider") renderSliderWidget(host, q, autoSubmit);
  else if(type === "rank") renderRankWidget(host, q, autoSubmit);
  else renderBucketWidget(host, q, autoSubmit);

  startCountdown(()=>{
    if(autoSubmit.trigger) autoSubmit.trigger();
  });
}

function submitAnswer(value){
  playChime();
  clearCountdown();
  game.answers.push(value);
  game.index++;
  if(game.index < game.questions.length){
    renderPersonaQuestion();
  } else if(game.phase === "problem"){
    showIntermission("DIVERGENCE", renderProblemResult);
  } else {
    renderPersonaResult();
  }
}

      ${archetype.traits.map(t=>`<span class="trait-pill">${t}</span>`).join('')}
    </div>
    <p class="narration">${LEAN_LINES[Math.floor(Math.random() * LEAN_LINES.length)]}</p>
    <div class="other-personas">
      <div class="other-personas-label">Also worth exploring</div>
      <div class="persona-traits">
        ${others.map(a=>`<span class="trait-pill">${a.title}</span>`).join('')}
      </div>
    </div>
    ${parentEducatorNote}
    ${guideLink}
    <button class="choice" id="continueBtn">See your program</button>
    <button class="restart" id="replayBtn">Answer again, see who else you might be</button>
  `;
  document.getElementById('continueBtn').addEventListener('click', ()=>{

      showIntermission(game.branch, ()=> renderEnding(game.endingId));

function renderConnect(program){
  const LINKEDIN_URL = "https://sg.linkedin.com/company/fundamental-decisions";
  const EMAIL = "mail@fundamentaldecisions.com";
  const message = `Hi Team FD \u2014 I went through Moods of the Day and ${program.title} came up as the area we're most likely facing. I'd like to talk more about this.`;
  const mailtoUrl = `mailto:${EMAIL}?subject=${encodeURIComponent(program.title)}&body=${encodeURIComponent(message)}`;
  panel.innerHTML = `
    <div class="marker">Connect with us</div>
    ${personaIcons[program.dim]}
    <p class="narration">Copy this message, then reach Team FD by email or LinkedIn.</p>
    <textarea class="message-box" id="messageBox" readonly>${message}</textarea>
    <div class="connect-actions">
      <button class="copy-btn" id="copyMsgBtn">Copy message</button>
      <a class="next-link" href="${mailtoUrl}" target="_blank">Email us</a>
      <a class="next-link" href="${LINKEDIN_URL}" target="_blank" rel="noopener">Open LinkedIn</a>
    </div>
    <div style="margin-bottom:20px;">
      <a class="next-link" href="${CANVA_LINKS[game.branch]}" target="_blank" rel="noopener">Moods of the Day guide</a>
    </div>
    <button class="restart" id="backToResultBtn">Back</button>
    <button class="restart" id="startOverBtn">Start over</button>
  `;
  const copyBtn = document.getElementById('copyMsgBtn');
  copyBtn.addEventListener('click', ()=>{
    const box = document.getElementById('messageBox');
    box.select();
    box.setSelectionRange(0, message.length);
    let copied = false;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(message).then(()=>{ copied = true; }).catch(()=>{});
    }
    try{ document.execCommand('copy'); copied = true; } catch(e){}
    copyBtn.textContent = "Copied";
    copyBtn.classList.add('copied');
    setTimeout(()=>{
      copyBtn.textContent = "Copy message";
      copyBtn.classList.remove('copied');
    }, 2000);
  });
  document.getElementById('backToResultBtn').addEventListener('click', ()=> renderProblemResult());
  document.getElementById('startOverBtn').addEventListener('click', ()=>{
    document.getElementById('pageBadge').classList.remove('visible');
    userName = null;
    userLocation = null;
    render('start');
  });
}

// Slider widget: drag handle between poles, value 0 (left/a) to 1 (right/b)
function renderSliderWidget(host, q, autoSubmit){
  const flip = Math.random() < 0.5;
  const leftText = flip ? q.b : q.a;
  const rightText = flip ? q.a : q.b;
  host.innerHTML = `
    <div class="slider-wrap">
      <div class="slider-poles"><span>${leftText}</span><span>${rightText}</span></div>
      <div class="slider-track" id="track">
        <div class="slider-fill" id="fill"></div>
        <div class="slider-handle" id="handle"></div>
      </div>
    </div>
    <button class="choice" id="confirmBtn" style="margin-top:20px;">Confirm</button>
  `;
  const track = document.getElementById('track');
  const fill = document.getElementById('fill');
  const handle = document.getElementById('handle');
  let value = 0.5;

  function paint(){
    fill.style.width = (value*100) + "%";
    handle.style.left = (value*100) + "%";
  }
  paint();

  function setFromClientX(clientX){
    const rect = track.getBoundingClientRect();
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.max(0, Math.min(1, pct));
    value = pct;
    paint();
  }

  function onDown(e){
    e.preventDefault();
    const move = (ev)=>{
      const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
      setFromClientX(clientX);
    };
    const up = ()=>{
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
      window.removeEventListener('touchmove', move);
      window.removeEventListener('touchend', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', up);
  }
  handle.addEventListener('mousedown', onDown);
  handle.addEventListener('touchstart', onDown, {passive:false});
  track.addEventListener('mousedown', (e)=>{ setFromClientX(e.clientX); });

  function confirm(){
    // value is 0..1 left-to-right; convert back to the true a(0)/b(1) scale
    const answer = flip ? (1 - value) : value;
    submitAnswer(answer);
  }
  document.getElementById('confirmBtn').addEventListener('click', confirm);
  autoSubmit.trigger = confirm;
}

// Rank widget: two stacked cards, drag to reorder; top card = "more true"
// Selection widget: click the statement that's more true \u2014 no dragging
function renderRankWidget(host, q, autoSubmit){
  const order = shuffleArray([ {text:q.a, val:0}, {text:q.b, val:1} ]);

  host.innerHTML = `
    <div class="rank-stack" id="stack">
      ${order.map(item=>`<button class="rank-card" data-val="${item.val}">${item.text}</button>`).join('')}
    </div>
  `;
  host.querySelectorAll('.rank-card').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      submitAnswer(Number(btn.getAttribute('data-val')));
    });
  });

  // nothing selected yet on timeout \u2014 pick randomly between the two
  autoSubmit.trigger = ()=> submitAnswer(Math.random() < 0.5 ? 0 : 1);
}

// Bucket widget: drag (or tap, on touch) one card into the left (a) or right (b) zone
function renderBucketWidget(host, q, autoSubmit){
  const flip = Math.random() < 0.5;
  const left = flip ? { text:q.b, val:1 } : { text:q.a, val:0 };
  const right = flip ? { text:q.a, val:0 } : { text:q.b, val:1 };
  host.innerHTML = `
    <p style="font-size:14px;color:var(--text-muted);margin-bottom:14px;">Tap the side that fits you.</p>
    <div class="bucket-row">
      <button class="bucket-zone" id="zoneA" style="cursor:pointer;">${left.text}</button>
      <button class="bucket-zone" id="zoneB" style="cursor:pointer;">${right.text}</button>
    </div>
  `;
  const zoneA = document.getElementById('zoneA');
  const zoneB = document.getElementById('zoneB');

  zoneA.addEventListener('click', ()=> submitAnswer(left.val));
  zoneB.addEventListener('click', ()=> submitAnswer(right.val));

  // no tap made a choice yet, so pick randomly between the two on timeout
  autoSubmit.trigger = ()=> submitAnswer(Math.random() < 0.5 ? left.val : right.val);
}

function renderEnding(id){
  const e = endings[id];
  updateBar(1);
  const namePrefix = userName ? `${userName}, ` : "";
  const locationSuffix = userLocation ? ` all the way from ${userLocation}` : "";
  const moodSuffix = e.moodSuffix || "that's exactly where this pointed.";
  const moodLine = (userMood && userEnergy)
    ? `<p class="narration" style="opacity:0.75;font-size:15px;">${namePrefix}you started today feeling ${userMood.toLowerCase()}, with ${userEnergy.toLowerCase()} energy${locationSuffix} \u2014 ${moodSuffix}</p>`
    : "";
  const playCountLine = totalPlays !== null
    ? `<p class="play-count">You're one of ${totalPlays.toLocaleString()} people who've explored this so far.</p>`
    : "";
  panel.innerHTML = `
    <div class="marker">Your program</div>
    ${svgIcons.bridge}
    <h1>${e.title}</h1>
    ${e.narration ? `<p class="narration">${e.narration}</p>` : ""}
    ${moodLine}
    ${playCountLine}
    ${e.desc ? `<div class="ending-desc">${e.desc}</div>` : ""}
    <a class="next-link" href="${e.link}" target="_blank" rel="noopener">${e.linkLabel || "Next steps"}</a>
    ${e.link2 ? `<a class="next-link" href="${e.link2}" target="_blank" rel="noopener" style="margin-left:10px;">${e.linkLabel2 || "Learn more"}</a>` : ""}
    <button class="restart" id="restartBtn">Start over</button>
  `;
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    document.getElementById('pageBadge').classList.remove('visible');
    userName = null;
    userLocation = null;
    render('start');
  });
}

function updateBar(fraction){
  const pct = Math.round(Math.min(1, Math.max(0, fraction)) * 100);
  ropeFill.style.width = pct + "%";
  loadPct.textContent = pct + "%";
}

// ---- Sound: subtle selection chimes ----
// Synthesized with Web Audio (no audio files to embed/host) so every
// selection gets a soft upward chime. Volume is user-controlled and starts
// at a low default; AudioContext is created lazily on first use since
// browsers require a user gesture before audio can play.
let audioCtx = null;
let chimeVolume = 0.25;

function getAudioCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
  }
  return audioCtx;
}

function playChime(){
  if(chimeVolume <= 0) return;
  const ctx = getAudioCtx();
  if(!ctx) return;
  if(ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(760, now);
  osc.frequency.exponentialRampToValueAtTime(1180, now + 0.09);
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(chimeVolume * 0.35, now + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.35);
}

const soundToggle = document.getElementById('soundToggle');
const volumeSlider = document.getElementById('volumeSlider');
let lastVolumeValue = volumeSlider.value;
chimeVolume = Number(volumeSlider.value) / 100;

volumeSlider.addEventListener('input', ()=>{
  chimeVolume = Number(volumeSlider.value) / 100;
  soundToggle.innerHTML = chimeVolume <= 0 ? '&#128263;' : '&#128276;';
});
soundToggle.addEventListener('click', ()=>{
  if(chimeVolume > 0){
    lastVolumeValue = volumeSlider.value;
    volumeSlider.value = 0;
    chimeVolume = 0;
    soundToggle.innerHTML = '&#128263;';
  } else {
    volumeSlider.value = lastVolumeValue || 25;
    chimeVolume = Number(volumeSlider.value) / 100;
    soundToggle.innerHTML = '&#128276;';
  }
});

// ---- Themed sounds per program: 3 short pleasant tonal phrases each ----
// Pure oscillator synthesis, no noise bed. Each theme has 3 variants; one
// plays at random every few seconds while its intermission image is showing.
function tone(ctx, freq, startOffset, duration, volume, type){
  const now = ctx.currentTime + startOffset;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, now);
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(volume, now + 0.04);
  g.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  osc.connect(g);
  g.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + duration + 0.05);
}
function glide(ctx, fromFreq, toFreq, startOffset, duration, volume, type){
  const now = ctx.currentTime + startOffset;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(fromFreq, now);
  osc.frequency.exponentialRampToValueAtTime(toFreq, now + duration);
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(volume, now + 0.04);
  g.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  osc.connect(g);
  g.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + duration + 0.05);
}

const THEME_SOUNDS = {
  // Nomadic: airy, gentle, sine tones
  nomadic: [
    (ctx, v)=>{ tone(ctx, 392.0, 0, 1.2, v, 'sine'); tone(ctx, 523.3, 0.25, 1.4, v*0.9, 'sine'); },
    (ctx, v)=>{ tone(ctx, 659.3, 0, 1.8, v, 'sine'); },
    (ctx, v)=>{ tone(ctx, 523.3, 0, 1.0, v, 'sine'); tone(ctx, 440.0, 0.3, 1.0, v*0.85, 'sine'); tone(ctx, 392.0, 0.6, 1.1, v*0.75, 'sine'); }
  ],
  // Project Infinity: lower, moodier, triangle tones with a minor interval
  infinity: [
    (ctx, v)=>{ tone(ctx, 220.0, 0, 1.3, v, 'triangle'); tone(ctx, 261.6, 0, 1.3, v*0.8, 'triangle'); },
    (ctx, v)=>{ tone(ctx, 164.8, 0, 2.4, v*0.9, 'triangle'); },
    (ctx, v)=>{ glide(ctx, 146.8, 207.7, 0, 0.9, v, 'triangle'); }
  ],
  // Divergence: warm, professional, major triad, sine
  divergence: [
    (ctx, v)=>{ tone(ctx, 261.6, 0, 0.9, v, 'sine'); tone(ctx, 329.6, 0.2, 0.9, v*0.9, 'sine'); tone(ctx, 392.0, 0.4, 1.0, v*0.85, 'sine'); },
    (ctx, v)=>{ tone(ctx, 196.0, 0, 1.6, v, 'sine'); },
    (ctx, v)=>{ tone(ctx, 392.0, 0, 0.8, v, 'sine'); tone(ctx, 329.6, 0.18, 0.8, v*0.9, 'sine'); tone(ctx, 261.6, 0.36, 0.9, v*0.85, 'sine'); }
  ],
  // Bootcamp: bright, playful, quick triangle notes
  bootcamp: [
    (ctx, v)=>{ tone(ctx, 523.3, 0, 0.28, v, 'triangle'); tone(ctx, 659.3, 0.13, 0.28, v*0.9, 'triangle'); tone(ctx, 784.0, 0.26, 0.35, v*0.85, 'triangle'); },
    (ctx, v)=>{ tone(ctx, 784.0, 0, 0.14, v, 'triangle'); tone(ctx, 784.0, 0.16, 0.16, v*0.9, 'triangle'); },
    (ctx, v)=>{ glide(ctx, 523.3, 784.0, 0, 0.3, v, 'triangle'); }
  ]
};

let ambientState = null;

function playRandomThemeSound(themeKey){
  const ctx = getAudioCtx();
  if(!ctx || chimeVolume <= 0) return;
  const variants = THEME_SOUNDS[themeKey];
  if(!variants) return;
  const fn = variants[Math.floor(Math.random() * variants.length)];
  fn(ctx, chimeVolume * 0.3);
}

function startAmbient(themeKey){
  stopAmbient();
  if(!THEME_SOUNDS[themeKey] || chimeVolume <= 0) return;
  playRandomThemeSound(themeKey);
  let timer = null;
  function scheduleNext(){
    const delay = 3500 + Math.random() * 3000;
    timer = setTimeout(()=>{
      playRandomThemeSound(themeKey);
      scheduleNext();
    }, delay);
  }
  scheduleNext();
  ambientState = { cancel: ()=>{ if(timer) clearTimeout(timer); } };
}

function stopAmbient(){
  if(!ambientState) return;
  ambientState.cancel();
  ambientState = null;
}

// ---- Program intermission: fade the themed image in, hold ~20s, fade out ----
const intermissionEl = document.getElementById('intermission');
const intermissionImg = document.getElementById('intermissionImg');

function showIntermission(branchKey, callback){
  const key = INTERMISSION_BRANCH_KEY[branchKey];
  if(!key || !INTERMISSION_SRC[key]){ callback(); return; }

  intermissionImg.src = INTERMISSION_SRC[key];
  intermissionEl.classList.add('visible');
  startAmbient(key);

  let done = false;
  let autoTimer = null;
  function proceed(){
    if(done) return;
    done = true;
    if(autoTimer) clearTimeout(autoTimer);
    intermissionEl.classList.remove('visible');
    intermissionEl.removeEventListener('click', proceed);
    stopAmbient();
    setTimeout(callback, 720);
  }
  intermissionEl.addEventListener('click', proceed);
  autoTimer = setTimeout(proceed, 20000);
}

// ---- Splash screen ----
const splashEl = document.getElementById('splash');
function dismissSplash(){
  splashEl.classList.add('fade-out');
}
splashEl.addEventListener('click', dismissSplash);
setTimeout(dismissSplash, 3200);

// ---- Shared play count (simple total, no location tracking) ----
// Uses countapi.xyz, a free keyless hit-counter service \u2014 one shared number,
// incremented once per page load, visible to everyone who plays. No backend
// of our own to run or pay for; if the service is ever unreachable this
// fails silently and the line just doesn't appear.
let totalPlays = null;
function paintPlayCount(){
  const el = document.getElementById('playCountDisplay');
  if(el && totalPlays !== null){
    el.textContent = `You're joining ${totalPlays.toLocaleString()} others who've played this.`;
  }
}
fetch('https://api.countapi.xyz/hit/teamfd-moods-of-the-day/plays')
  .then(r => r.json())
  .then(data => {
    totalPlays = data.value;
    paintPlayCount();
  })
  .catch(()=>{ /* counter is a nice-to-have, fail silently */ });

// ---- Mood / energy check-in (replaces the old static opening screen) ----
let userMood = null;
let userEnergy = null;

const MOOD_OPTIONS = ["Curious", "Energized", "Calm", "Tired", "Stressed", "Overwhelmed"];
const ENERGY_OPTIONS = ["Running on empty", "Low", "Steady", "High", "Fully charged"];

    </div>

  paintPlayCount();

    btn.addEventListener('click', ()=>{

function renderMoodScreen2(){
  panel.innerHTML = `
    <div class="marker">One more thing</div>
    <p class="narration">And your energy levels right now?</p>
    <div class="mood-grid" id="energyGrid">
      ${ENERGY_OPTIONS.map(e => `<button class="mood-chip" data-energy="${e}">${e}</button>`).join('')}

  `;
  panel.querySelectorAll('.mood-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      playChime();
      userEnergy = btn.getAttribute('data-energy');
      renderMoodAck();
    });

}

const MOOD_NOTES = {
  "Curious": "Curious is a great place to start from.",
  "Energized": "That energy's going to help.",
  "Calm": "Calm is a good headspace for this.",
  "Tired": "Tired is okay \u2014 we'll keep this light.",
  "Stressed": "Let's take this one step at a time.",
  "Overwhelmed": "No pressure here \u2014 just pick what's true."
};
const ENERGY_NOTES = {
  "Running on empty": "we'll keep this short.",
  "Low": "no need to rush through it.",
  "Steady": "that's a solid place to work from.",
  "High": "let's put it to good use.",
  "Fully charged": "let's make the most of it."
};

// 10 phrasings of the same invitation \u2014 discover programs to grow yourself
// and your teams, then a few quick honest questions. Tagged by energy so the
// tone actually matches how someone said they're feeling, not just random.
const PROGRAM_INTRO_LINES = [
  { tone:"high", text:"Ready to level up? Let's explore how you can grow \u2014 and how the people around you can grow too. A few quick questions is all it takes to find the program built for exactly where you are. There's no wrong answer here, just pick what's true right now." },
  { tone:"high", text:"Let's turn that energy into direction. A few quick questions will point you toward the program that fits best \u2014 for you, and for the team you work with. No wrong answers, just what's true right now." },
  { tone:"high", text:"Whether it's you or your team that's ready to grow, there's a program built for that. A few quick, honest questions will get you there. No wrong answers, just what's true right now." },
  { tone:"low", text:"If you're curious about growing \u2014 for yourself, or for the team around you \u2014 there are a few paths worth exploring. This takes just a few quiet moments: a handful of questions, no wrong answers, just what feels true right now." },
  { tone:"low", text:"Take it easy \u2014 this won't take long. Just a few simple questions to find a program that could help you and the people around you grow. Answer honestly, that's all it takes." },
  { tone:"low", text:"One step at a time. A few quick questions can help surface the right program to support you and the people you work with. There's no wrong answer, just what feels true right now." },
  { tone:"any", text:"If you'd like to discover how to grow \u2014 for yourself and the teams you work with \u2014 let's explore a few programs that could help. It only takes a few quick questions. There's no wrong answer, just what's true for you right now." },
  { tone:"any", text:"Growth doesn't happen alone \u2014 it's you, and the people around you. Let's find the program that fits where you are today. A few quick questions, no wrong answers, just honesty." },
  { tone:"any", text:"If you're wondering what's next \u2014 for yourself, or for your team \u2014 a few honest answers will point the way. No right or wrong here, just what's true for you right now." },
  { tone:"any", text:"Growth starts with a little honesty. If you're curious how to support yourself \u2014 and the people around you \u2014 a few quick questions will point you to the right program. Just answer what feels true." }
];

function energyBucket(energy){
  if(["Running on empty", "Low"].includes(energy)) return "low";
  if(["High", "Fully charged"].includes(energy)) return "high";
  return "any";
}

function pickProgramIntro(energy){
  const bucket = energyBucket(energy);
  const matches = PROGRAM_INTRO_LINES.filter(l => l.tone === bucket || l.tone === "any");
  const pool = matches.length ? matches : PROGRAM_INTRO_LINES;
  return pool[Math.floor(Math.random() * pool.length)].text;
}

function renderMoodAck(){
  const moodLine = MOOD_NOTES[userMood] || `Feeling ${userMood.toLowerCase()} \u2014 noted.`;
  const energyLine = ENERGY_NOTES[userEnergy] || "let's get started.";
  const introLine = pickProgramIntro(userEnergy);
  panel.innerHTML = `
    <div class="marker">Got it</div>
    ${svgIcons.bridge}
    <p class="narration">${moodLine} And with ${userEnergy.toLowerCase()} energy, ${energyLine}</p>
    <p class="narration">${introLine}</p>
    <p class="narration">We have a few programs that might help you improve yourself and the people around you \u2014 keep exploring if you'd like to know more.</p>
    <button class="choice" id="beginBtn">Begin</button>
  `;
  document.getElementById('beginBtn').addEventListener('click', ()=> renderNameLocation());
}

let userName = null;
let userLocation = null;

function renderNameLocation(){
  panel.innerHTML = `
    <div class="marker">Almost there</div>
    ${svgIcons.compass}
    <p class="narration">Before we go on \u2014 what should we call you, and where are you joining from?</p>
    <div class="mood-custom" style="margin-bottom:12px;">

    <button class="choice" id="nameContinueBtn">Continue</button>
  `;
  document.getElementById('nameContinueBtn').addEventListener('click', ()=>{
    const name = document.getElementById('nameInput').value.trim();
    const location = document.getElementById('locationInput').value.trim();
    userName = name || null;
    userLocation = location || null;
    render('q0');
  });
}

render('start');
