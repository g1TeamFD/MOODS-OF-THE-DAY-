<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moods of the Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#232a3d;
    --bg-panel:#2e3650;
    --wood:#8c5b33;
    --wood-light:#a9713f;
    --amber:#e8a33d;
    --text-light:#f1ead9;
    --text-muted:#b9b2a0;
    --line:rgba(241,234,217,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #3a4566 0%, var(--bg-deep) 55%);
    color:var(--text-light);
    font-family:'Work Sans', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    padding-bottom:96px;
  }
  .stage{
    width:100%;
    max-width:620px;
  }
  .rope-bar{
    height:6px;
    border-radius:3px;
    background:linear-gradient(90deg, var(--wood) 0%, var(--wood) 100%);
    position:relative;
    margin-bottom:10px;
    overflow:hidden;
  }
  .rope-bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--amber), #ffd27a);
    transition:width 0.6s ease;
  }
  .load-label{
    font-size:13px;
    color:var(--text-muted);
    letter-spacing:0.02em;
    margin-bottom:28px;
    display:flex;
    justify-content:space-between;
  }
  .marker{
    font-family:'Bitter', serif;
    font-size:14px;
    color:var(--amber);
    margin-bottom:10px;
  }
  .panel{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:40px 36px;
    position:relative;
  }
  .icon{
    width:64px;
    height:64px;
    margin-bottom:20px;
    color:var(--wood-light);
  }
  h1{
    font-family:'Bitter', serif;
    font-weight:700;
    font-size:28px;
    line-height:1.25;
    margin:0 0 6px 0;
    color:var(--text-light);
  }
  .kicker{
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    color:var(--text-muted);
    margin-bottom:18px;
  }
  p.narration{
    font-family:'Bitter', serif;
    font-size:19px;
    line-height:1.6;
    color:var(--text-light);
    max-width:44ch;
    margin:0 0 30px 0;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  button.choice{
    text-align:left;
    background:transparent;
    border:1px solid var(--line);
    border-left:3px solid var(--wood-light);
    color:var(--text-light);
    font-family:'Work Sans', sans-serif;
    font-size:16px;
    font-weight:500;
    padding:16px 18px;
    border-radius:2px;
    cursor:pointer;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  button.choice:hover, button.choice:focus-visible{
    background:rgba(232,163,61,0.08);
    border-left-color:var(--amber);
    outline:none;
  }
  button.choice:focus-visible{
    box-shadow:0 0 0 2px var(--amber);
  }
  .ending-desc{
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    color:var(--text-muted);
    line-height:1.6;
    border-top:1px solid var(--line);
    padding-top:20px;
    margin-top:24px;
  }
  .ending-desc a{
    color:var(--amber);
  }
  .next-link{
    display:inline-block;
    margin-top:24px;
    background:var(--amber);
    color:var(--bg-deep);
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    font-weight:600;
    padding:12px 20px;
    border-radius:2px;
    text-decoration:none;
  }
  .next-link:hover, .next-link:focus-visible{
    background:#ffd27a;
  }
  .restart{
    margin-top:16px;
    display:block;
    background:none;
    border:none;
    color:var(--amber);
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    cursor:pointer;
    padding:0;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  @media (prefers-reduced-motion: reduce){
    .rope-bar-fill{transition:none;}
  }
  @media (max-width:480px){
    .panel{padding:28px 22px;}
    h1{font-size:24px;}
    p.narration{font-size:17px;}
  }
  .page-badge{
    position:fixed;
    top:18px;
    left:22px;
    font-family:'Work Sans', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:transparent;
    -webkit-text-stroke:1px var(--text-light);
    text-stroke:1px var(--text-light);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.4s ease;
    z-index:20;
  }
  .page-badge.visible{
    opacity:1;
  }
  @media (max-width:480px){
    .page-badge{font-size:12px; top:12px; left:16px;}
  }

  .footer-logo{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    width:100%;
    background:#ffffff;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:12px 28px;
    z-index:10;
  }
  .footer-logo img{
    max-width:200px;
    width:100%;
    height:auto;
    display:block;
    transition:opacity 0.2s ease;
  }
  .footer-logo a{
    display:block;
    line-height:0;
  }
  .footer-logo a:hover img{
    opacity:0.75;
  }
  @media (max-width:480px){
    .footer-logo{padding:10px 18px;}
    .footer-logo img{max-width:150px;}
  }

  /* ---- Persona mini-game widgets ---- */
  .persona-progress{
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:16px;
  }
  .persona-prompt{
    font-family:'Bitter', serif;
    font-size:19px;
    line-height:1.5;
    margin:0 0 30px 0;
  }

  /* Slider widget */
  .slider-wrap{margin-bottom:8px;}
  .slider-poles{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    color:var(--text-light);
    margin-bottom:14px;
    gap:16px;
  }
  .slider-poles span{max-width:46%;}
  .slider-track{
    position:relative;
    height:6px;
    background:var(--line);
    border-radius:3px;
    margin:20px 4px;
    touch-action:none;
  }
  .slider-fill{
    position:absolute;
    left:0; top:0; height:100%;
    background:var(--wood-light);
    border-radius:3px;
  }
  .slider-handle{
    position:absolute;
    top:50%;
    width:22px; height:22px;
    background:var(--amber);
    border-radius:50%;
    transform:translate(-50%,-50%);
    cursor:grab;
    box-shadow:0 0 0 4px rgba(232,163,61,0.2);
  }
  .slider-handle:active{cursor:grabbing;}

  /* Rank widget (two stacked draggable cards) */
  .rank-stack{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .rank-card{
    background:rgba(241,234,217,0.05);
    border:1px solid var(--line);
    border-left:3px solid var(--wood-light);
    padding:14px 16px;
    font-size:15px;
    border-radius:2px;
    cursor:grab;
    user-select:none;
    touch-action:none;
  }
  .rank-card.dragging{
    opacity:0.5;
  }
  .rank-hint{
    font-size:12px;
    color:var(--text-muted);
    margin-top:10px;
  }

  /* Bucket widget */
  .bucket-row{
    display:flex;
    gap:12px;
    margin-top:8px;
  }
  .bucket-zone{
    flex:1;
    min-height:110px;
    border:1px dashed var(--line);
    border-radius:4px;
    padding:12px;
    font-size:13px;
    color:var(--text-muted);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:8px;
    text-align:center;
  }
  .bucket-zone.over{
    border-color:var(--amber);
    background:rgba(232,163,61,0.06);
  }
  .drag-card{
    background:var(--amber);
    color:var(--bg-deep);
    font-weight:600;
    font-size:14px;
    padding:14px 16px;
    border-radius:2px;
    cursor:grab;
    user-select:none;
    touch-action:none;
    max-width:220px;
  }
  .drag-card.dragging{opacity:0.4;}

  /* Persona result card */
  .persona-title{
    font-family:'Bitter', serif;
    font-weight:700;
    font-size:24px;
    color:var(--amber);
    margin:0 0 8px 0;
  }
  .persona-icon{
    width:72px;
    height:72px;
    color:var(--amber);
    margin-bottom:16px;
  }
  .persona-traits{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:20px;
  }
  .trait-pill{
    border:1px solid var(--line);
    border-radius:20px;
    padding:5px 12px;
    font-size:13px;
    color:var(--text-light);
  }
  .other-personas{
    border-top:1px solid var(--line);
    padding-top:18px;
    margin-bottom:22px;
  }
  .other-personas-label{
    font-size:13px;
    color:var(--text-muted);
    margin-bottom:10px;
  }
  .countdown{
    font-size:12px;
    color:var(--text-muted);
    margin-bottom:16px;
  }
  .countdown.urgent{
    color:var(--amber);
  }
  .message-box{
    width:100%;
    min-height:110px;
    background:rgba(241,234,217,0.05);
    border:1px solid var(--line);
    border-radius:4px;
    color:var(--text-light);
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    line-height:1.6;
    padding:14px;
    resize:vertical;
    margin-bottom:16px;
  }
  .connect-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:20px;
  }
  .copy-btn{
    background:transparent;
    border:1px solid var(--wood-light);
    color:var(--text-light);
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    font-weight:500;
    padding:12px 18px;
    border-radius:2px;
    cursor:pointer;
  }
  .copy-btn:hover{
    border-color:var(--amber);
  }
  .copy-btn.copied{
    border-color:var(--amber);
    color:var(--amber);
  }
</style>
</head>

// Score each dimension independently from only the questions tagged to it,
// then return the archetype/program whose dimension scored highest.
function computeTopArchetype(archetypeList, questions, answers){
  const dimTotals = {}; // dim -> {sum, count}
  questions.forEach((q, i)=>{
    if(!dimTotals[q.dim]) dimTotals[q.dim] = { sum:0, count:0 };
    dimTotals[q.dim].sum += answers[i];
    dimTotals[q.dim].count += 1;
  });
  let best = null;
  archetypeList.forEach(arch=>{
    const d = dimTotals[arch.dim];
    const avg = d ? d.sum / d.count : 0;
    if(!best || avg > best.avg){
      best = { arch, avg };
    }
  });
  return best.arch;
}

function buildWidgetSequence(){
  // 10 questions, mix of the three mechanics, order randomized
  const base = ["slider","slider","slider","slider","rank","rank","rank","bucket","bucket","bucket"];
  for(let i = base.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [base[i], base[j]] = [base[j], base[i]];
  }
  return base;
}

// ---- Countdown (auto-select after 20s of no answer) ----
const CHOICE_SECONDS = 20;
let countdownInterval = null;

function clearCountdown(){
  if(countdownInterval){
    clearInterval(countdownInterval);
    countdownInterval = null;
  }
}

function startCountdown(onTimeout){
  clearCountdown();
  let remaining = CHOICE_SECONDS;
  paintCountdown(remaining);
  countdownInterval = setInterval(()=>{
    remaining--;
    paintCountdown(remaining);
    if(remaining <= 0){
      clearCountdown();
      onTimeout();
    }
  }, 1000);
}

function paintCountdown(remaining){
  const el = document.getElementById('countdownDisplay');
  if(!el) return;
  el.textContent = remaining > 0 ? `Auto-selecting in ${remaining}s` : "Selecting\u2026";
  el.classList.toggle('urgent', remaining <= 5);
}

function shuffleArray(arr){
  const copy = arr.slice();
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function startPersonaGame(branch, endingId){
  game = {
    branch,
    endingId,
    phase: "persona",
    progressLabel: "Persona check",
    archetypes: ARCHETYPES[branch],
    questions: shuffleArray(QUESTION_BANKS[branch]),
    widgetTypes: buildWidgetSequence(),
    index: 0,
    answers: []
  };
  renderPersonaQuestion();
}

function startProblemGame(){
  game = {
    branch: game.branch,
    endingId: game.endingId,
    phase: "problem",
    progressLabel: "Organization check",
    archetypes: PROBLEM_PROGRAMS,
    questions: shuffleArray(PROBLEM_QUESTIONS),
    widgetTypes: buildWidgetSequence(),
    index: 0,
    answers: []
  };
  renderPersonaQuestion();
}

function renderPersonaQuestion(){
  const q = game.questions[game.index];
  const type = game.widgetTypes[game.index];
  const prompt = game.phase === "problem"
    ? "Which feels closer to how your organization actually runs?"
    : "Which feels closer to you?";
  updateBar(game.index / game.questions.length);
  panel.innerHTML = `
    <div class="persona-progress">${game.progressLabel} \u2014 ${game.index + 1} of ${game.questions.length}</div>
    <p class="persona-prompt">${prompt}</p>
    <div class="countdown" id="countdownDisplay"></div>
    <div id="widgetHost"></div>
  `;
  const host = document.getElementById('widgetHost');
  const autoSubmit = { trigger: null };
  if(type === "slider") renderSliderWidget(host, q, autoSubmit);
  else if(type === "rank") renderRankWidget(host, q, autoSubmit);
  else renderBucketWidget(host, q, autoSubmit);

  startCountdown(()=>{
    if(autoSubmit.trigger) autoSubmit.trigger();
  });
}

function submitAnswer(value){
  clearCountdown();
  game.answers.push(value);
  game.index++;
  if(game.index < game.questions.length){
    renderPersonaQuestion();
  } else if(game.phase === "problem"){
    renderProblemResult();
  } else {
    renderPersonaResult();
  }
}

    <a class="next-link" href="${program.link}" target="_blank" rel="noopener" style="margin-right:10px;">Explore real cases</a>
    <button class="choice" id="connectBtn" style="margin-top:14px;">Connect with us on this</button>
    <button class="restart" id="replayProblemBtn">Answer again</button>
  `;
  document.getElementById('connectBtn').addEventListener('click', ()=> renderConnect(program));
  document.getElementById('replayProblemBtn').addEventListener('click', ()=> startProblemGame());
}

function renderConnect(program){
  const LINKEDIN_URL = "https://sg.linkedin.com/company/fundamental-decisions";
  const EMAIL = "mail@fundamentaldecisions.com";
  const message = `Hi Team FD \u2014 I went through Moods of the Day and ${program.title} came up as the area we're most likely facing. I'd like to talk more about this.`;
  const mailtoUrl = `mailto:${EMAIL}?subject=${encodeURIComponent(program.title)}&body=${encodeURIComponent(message)}`;
  panel.innerHTML = `
    <div class="marker">Connect with us</div>
    ${personaIcons[program.dim]}
    <p class="narration">Copy this message, then reach Team FD by email or LinkedIn.</p>
    <textarea class="message-box" id="messageBox" readonly>${message}</textarea>
    <div class="connect-actions">
      <button class="copy-btn" id="copyMsgBtn">Copy message</button>
      <a class="next-link" href="${mailtoUrl}" target="_blank">Email us</a>
      <a class="next-link" href="${LINKEDIN_URL}" target="_blank" rel="noopener">Open LinkedIn</a>
    </div>
    <div style="margin-bottom:20px;">
      <a class="next-link" href="${CANVA_LINKS[game.branch]}" target="_blank" rel="noopener">Moods of the Day guide</a>
    </div>
    <button class="restart" id="backToResultBtn">Back</button>
    <button class="restart" id="startOverBtn">Start over</button>
  `;
  const copyBtn = document.getElementById('copyMsgBtn');
  copyBtn.addEventListener('click', ()=>{
    const box = document.getElementById('messageBox');
    box.select();
    box.setSelectionRange(0, message.length);
    let copied = false;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(message).then(()=>{ copied = true; }).catch(()=>{});
    }
    try{ document.execCommand('copy'); copied = true; } catch(e){}
    copyBtn.textContent = "Copied";
    copyBtn.classList.add('copied');
    setTimeout(()=>{
      copyBtn.textContent = "Copy message";
      copyBtn.classList.remove('copied');
    }, 2000);
  });
  document.getElementById('backToResultBtn').addEventListener('click', ()=> renderProblemResult());
  document.getElementById('startOverBtn').addEventListener('click', ()=>{
    document.getElementById('pageBadge').classList.remove('visible');
    render('start');
  });
}

// Slider widget: drag handle between poles, value 0 (left/a) to 1 (right/b)
function renderSliderWidget(host, q, autoSubmit){
  const flip = Math.random() < 0.5;
  const leftText = flip ? q.b : q.a;
  const rightText = flip ? q.a : q.b;
  host.innerHTML = `
    <div class="slider-wrap">
      <div class="slider-poles"><span>${leftText}</span><span>${rightText}</span></div>
      <div class="slider-track" id="track">
        <div class="slider-fill" id="fill"></div>
        <div class="slider-handle" id="handle"></div>
      </div>
    </div>
    <button class="choice" id="confirmBtn" style="margin-top:20px;">Confirm</button>
  `;
  const track = document.getElementById('track');
  const fill = document.getElementById('fill');
  const handle = document.getElementById('handle');
  let value = 0.5;

  function paint(){
    fill.style.width = (value*100) + "%";
    handle.style.left = (value*100) + "%";
  }
  paint();

  function setFromClientX(clientX){
    const rect = track.getBoundingClientRect();
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.max(0, Math.min(1, pct));
    value = pct;
    paint();
  }

  function onDown(e){
    e.preventDefault();
    const move = (ev)=>{
      const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
      setFromClientX(clientX);
    };
    const up = ()=>{
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
      window.removeEventListener('touchmove', move);
      window.removeEventListener('touchend', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    window.addEventListener('touchmove', move, {passive:false});
    window.addEventListener('touchend', up);
  }
  handle.addEventListener('mousedown', onDown);
  handle.addEventListener('touchstart', onDown, {passive:false});
  track.addEventListener('mousedown', (e)=>{ setFromClientX(e.clientX); });

  function confirm(){
    // value is 0..1 left-to-right; convert back to the true a(0)/b(1) scale
    const answer = flip ? (1 - value) : value;
    submitAnswer(answer);
  }
  document.getElementById('confirmBtn').addEventListener('click', confirm);
  autoSubmit.trigger = confirm;
}

// Rank widget: two stacked cards, drag to reorder; top card = "more true"
function renderRankWidget(host, q, autoSubmit){
  let order = shuffleArray([ {text:q.a, val:0}, {text:q.b, val:1} ]);

  function confirm(){
    submitAnswer(order[0].val === 0 ? 0.2 : 0.8);
  }
  autoSubmit.trigger = confirm;

  function paint(){
    host.innerHTML = `
      <div class="rank-stack" id="stack">
        ${order.map((item,i)=>`<div class="rank-card" draggable="true" data-i="${i}">${item.text}</div>`).join('')}
      </div>
      <div class="rank-hint">Drag to put the one that's more true for you on top.</div>
      <button class="choice" id="confirmBtn" style="margin-top:20px;">Confirm</button>
    `;
    const cards = host.querySelectorAll('.rank-card');
    let dragIndex = null;
    cards.forEach(card=>{
      card.addEventListener('dragstart', (e)=>{
        dragIndex = Number(card.getAttribute('data-i'));
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
      card.addEventListener('dragover', (e)=> e.preventDefault());
      card.addEventListener('drop', (e)=>{
        e.preventDefault();
        const dropIndex = Number(card.getAttribute('data-i'));
        if(dragIndex !== null && dragIndex !== dropIndex){
          const moved = order.splice(dragIndex, 1)[0];
          order.splice(dropIndex, 0, moved);
          paint();
        }
      });
    });
    document.getElementById('confirmBtn').addEventListener('click', confirm);
  }
  paint();
}

// Bucket widget: drag (or tap, on touch) one card into the left (a) or right (b) zone
function renderBucketWidget(host, q, autoSubmit){
  const flip = Math.random() < 0.5;
  const left = flip ? { text:q.b, val:1 } : { text:q.a, val:0 };
  const right = flip ? { text:q.a, val:0 } : { text:q.b, val:1 };
  host.innerHTML = `
    <p style="font-size:14px;color:var(--text-muted);margin-bottom:14px;">Drag the card to the side that fits you.</p>
    <div class="bucket-row">
      <div class="bucket-zone" id="zoneA">${left.text}</div>
      <div class="bucket-zone" id="zoneB">${right.text}</div>
    </div>
    <div style="display:flex;justify-content:center;margin-top:18px;">
      <div class="drag-card" id="card" draggable="true">Where do I belong?</div>
    </div>
  `;
  const card = document.getElementById('card');
  const zoneA = document.getElementById('zoneA');
  const zoneB = document.getElementById('zoneB');

  card.addEventListener('dragstart', ()=> card.classList.add('dragging'));
  card.addEventListener('dragend', ()=> card.classList.remove('dragging'));

  [ [zoneA,left.val], [zoneB,right.val] ].forEach(([zone,val])=>{
    zone.addEventListener('dragover', (e)=>{ e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', ()=> zone.classList.remove('over'));
    zone.addEventListener('drop', (e)=>{
      e.preventDefault();
      zone.classList.remove('over');
      submitAnswer(val);
    });
  });

  // touch fallback: native drag events are unreliable on mobile, so tapping a zone also works
  zoneA.addEventListener('click', ()=> submitAnswer(left.val));
  zoneB.addEventListener('click', ()=> submitAnswer(right.val));

  // no drag/tap made a choice yet, so pick randomly between the two on timeout
  autoSubmit.trigger = ()=> submitAnswer(Math.random() < 0.5 ? left.val : right.val);
}

function renderEnding(id){
  const e = endings[id];
  updateBar(1);
  panel.innerHTML = `
    <div class="marker">Your program</div>
    ${svgIcons.bridge}
    <h1>${e.title}</h1>
    <p class="narration">${e.narration}</p>
    ${e.desc ? `<div class="ending-desc">${e.desc}</div>` : ""}
    <a class="next-link" href="${e.link}" target="_blank" rel="noopener">${e.linkLabel || "Next steps"}</a>
    <button class="restart" id="restartBtn">Start over</button>
  `;
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    document.getElementById('pageBadge').classList.remove('visible');
    render('start');
  });
}

function updateBar(fraction){
  const pct = Math.round(Math.min(1, Math.max(0, fraction)) * 100);
  ropeFill.style.width = pct + "%";
  loadPct.textContent = pct + "%";
}

render('start');
</script>
